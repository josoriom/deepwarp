[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepwarp"
version = "0.1.0"
description = "Predict where each target elutes in an LC-MS run by warping its reference retention times."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "torch>=2.1", "onnx>=1.14"]

[project.optional-dependencies]
test = ["pytest>=7", "onnxruntime>=1.16"]

[project.urls]
Repository = "https://github.com/josoriom/deep-warp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
